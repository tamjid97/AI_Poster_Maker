<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1600" viewBox="0 0 1200 1600" version="1.1">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-v1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E15"/>
      <stop offset="50%" stop-color="#083827"/>
      <stop offset="100%" stop-color="#2D0A0E"/>
    </linearGradient>

    <radialGradient id="sunburst-glow-v1" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#186146" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#083827" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#041E15" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="gold-grad-v1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B3"/>
      <stop offset="35%" stop-color="#E2B842"/>
      <stop offset="70%" stop-color="#9E7412"/>
      <stop offset="100%" stop-color="#FCE582"/>
    </linearGradient>

    <!-- Red Ribbon Gradient -->
    <linearGradient id="red-ribbon-v1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800E1D"/>
      <stop offset="50%" stop-color="#B81D30"/>
      <stop offset="100%" stop-color="#6E0B18"/>
    </linearGradient>

    <!-- Green Ribbon Gradient -->
    <linearGradient id="green-ribbon-v1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#032D1F"/>
      <stop offset="50%" stop-color="#09543B"/>
      <stop offset="100%" stop-color="#032D1F"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow-v1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Photo Clip Paths -->
    <clipPath id="photo-clip-main-v1">
      <circle cx="600" cy="650" r="280"/>
    </clipPath>

    <clipPath id="photo-clip-2-v1">
      <circle cx="180" cy="1350" r="95"/>
    </clipPath>
  </defs>

  <!-- 1. Background Layer -->
  <rect x="0" y="0" width="1200" height="1600" fill="url(#bg-grad-v1)"/>
  <rect x="0" y="0" width="1200" height="1600" fill="url(#sunburst-glow-v1)"/>

  <!-- Print Safe Double Border -->
  <rect x="35" y="35" width="1130" height="1530" rx="8" fill="none" stroke="url(#gold-grad-v1)" stroke-width="3" opacity="0.8"/>
  <rect x="45" y="45" width="1110" height="1510" rx="6" fill="none" stroke="#006A4E" stroke-width="1.5" opacity="0.6"/>

  <!-- 2. National Memorial Watermark/Silhouette -->
  <g opacity="0.16" transform="translate(600, 430) scale(1.15)">
    <polygon points="0,-250 -25,100 25,100" fill="url(#gold-grad-v1)"/>
    <polygon points="0,-250 -55,100 -25,100" fill="#E2B842"/>
    <polygon points="0,-250 55,100 25,100" fill="#E2B842"/>
    <polygon points="0,-250 -90,100 -55,100" fill="url(#gold-grad-v1)"/>
    <polygon points="0,-250 90,100 55,100" fill="url(#gold-grad-v1)"/>
    <polygon points="0,-250 -130,100 -90,100" fill="#9E7412"/>
    <polygon points="0,-250 130,100 90,100" fill="#9E7412"/>
    <polygon points="0,-250 -170,100 -130,100" fill="url(#gold-grad-v1)"/>
    <polygon points="0,-250 170,100 130,100" fill="url(#gold-grad-v1)"/>
  </g>

  <!-- 3. Flag Motif (Top Right) -->
  <g transform="translate(1000, 90)">
    <rect x="0" y="0" width="120" height="72" rx="3" fill="#006A4E" stroke="url(#gold-grad-v1)" stroke-width="2"/>
    <circle cx="50" cy="36" r="22" fill="#F42A41"/>
    <rect x="-8" y="-6" width="6" height="100" rx="3" fill="url(#gold-grad-v1)"/>
  </g>

  <!-- 4. Date/Top Sub-label -->
  <text id="top-label" x="600" y="140" text-anchor="middle" fill="#FCE582" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" letter-spacing="4">
    ১৬ই ডিসেম্বর
  </text>

  <!-- 5. Headline Banner -->
  <g filter="url(#shadow-v1)">
    <path d="M 120 215 L 1080 215 L 1115 275 L 1080 335 L 120 335 L 85 275 Z" fill="url(#red-ribbon-v1)" stroke="url(#gold-grad-v1)" stroke-width="4"/>
    <text id="headline-text" x="600" y="298" text-anchor="middle" fill="#FFF8D6" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="70" font-weight="800">
      মহান বিজয় দিবস
    </text>
  </g>

  <!-- 6. Main Photo Frame & Rings -->
  <circle cx="600" cy="650" r="310" fill="none" stroke="#684A10" stroke-width="12"/>
  <circle cx="600" cy="650" r="298" fill="none" stroke="url(#gold-grad-v1)" stroke-width="8"/>
  <circle cx="600" cy="650" r="286" fill="#0B2B1E" stroke="#E2B842" stroke-width="2"/>

  <!-- Main Photo Placeholder Area -->
  <g clip-path="url(#photo-clip-main-v1)">
    <circle id="photo-slot-main" cx="600" cy="650" r="280" fill="#D3D3D3"/>
    <!-- Silhouette -->
    <circle cx="600" cy="585" r="70" fill="#A0A0A0"/>
    <path d="M 440 820 C 450 700 510 660 600 660 C 690 660 750 700 760 820 Z" fill="#A0A0A0"/>
    <text id="photo-placeholder-label" x="600" y="890" text-anchor="middle" fill="#555555" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="24" font-weight="600">
      ছবি সংযুক্ত করুন
    </text>
  </g>

  <!-- 7. Candidate Name Banner -->
  <g filter="url(#shadow-v1)">
    <path d="M 140 950 L 1060 950 L 1095 1005 L 1060 1060 L 140 1060 L 105 1005 Z" fill="url(#green-ribbon-v1)" stroke="url(#gold-grad-v1)" stroke-width="4"/>
    <text id="name-text" x="600" y="1025" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="72" font-weight="800">
      নামের স্থান
    </text>
  </g>

  <!-- 8. Designation Text -->
  <text id="designation-text" x="600" y="1115" text-anchor="middle" fill="#FCE582" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="38" font-weight="600">
    পদবী / সংগঠনের নাম
  </text>

  <!-- Divider Line -->
  <path d="M 280 1155 H 520 M 680 1155 H 920" stroke="url(#gold-grad-v1)" stroke-width="2.5"/>
  <polygon points="600,1145 610,1155 600,1165 590,1155" fill="#E2B842"/>

  <!-- 9. District / Area Badge -->
  <rect id="district-party-bg" x="280" y="1185" width="640" height="80" rx="40" fill="#041E15" stroke="url(#gold-grad-v1)" stroke-width="2"/>
  <text id="district-text" x="600" y="1238" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="34" font-weight="600">
    জেলা / এলাকার নাম
  </text>

  <!-- 10. Secondary Photo Frame (Lower Left) -->
  <circle cx="180" cy="1350" r="108" fill="#041E15" stroke="url(#gold-grad-v1)" stroke-width="6"/>
  <g clip-path="url(#photo-clip-2-v1)">
    <circle id="photo-slot-2" cx="180" cy="1350" r="95" fill="#C8C8C8"/>
    <circle cx="180" cy="1325" r="25" fill="#969696"/>
    <path d="M 135 1410 C 138 1370 155 1355 180 1355 C 205 1355 222 1370 225 1410 Z" fill="#969696"/>
  </g>
  <text id="photo-2-label" x="180" y="1475" text-anchor="middle" fill="#E2B842" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="600">
    সহযোদ্ধা
  </text>

  <!-- 11. Right Information Box -->
  <rect x="340" y="1300" width="720" height="160" rx="18" fill="#06261B" stroke="url(#gold-grad-v1)" stroke-width="2"/>
  <text id="information-heading" x="700" y="1348" text-anchor="middle" fill="#E2B842" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="26" font-weight="700">
    পরিচিতি
  </text>
  <text id="information-line-1" x="700" y="1392" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="500">
    সংক্ষিপ্ত পরিচিতি / বার্তা
  </text>
  <text id="information-line-2" x="700" y="1432" text-anchor="middle" fill="#B0C8BF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22">
    যোগাযোগের তথ্য / অন্যান্য বিবরণ
  </text>

  <!-- 12. Bottom Swoosh & Footer Banner -->
  <path d="M 0 1520 C 300 1470 600 1560 1200 1490 L 1200 1600 L 0 1600 Z" fill="#031A12"/>
  <path d="M 0 1520 C 300 1470 600 1560 1200 1490" fill="none" stroke="url(#gold-grad-v1)" stroke-width="4"/>
  <text id="footer-text" x="600" y="1565" text-anchor="middle" fill="#E2B842" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="24" font-weight="600">
    প্রচারে: আপনার বার্তা এখানে
  </text>
</svg>