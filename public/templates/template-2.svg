<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1600" viewBox="0 0 1200 1600" version="1.1">
  <defs>
    <!-- Dark Solemn Background Gradient - Enhanced -->
    <linearGradient id="bg-grad-v2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#2A2E2C"/>
      <stop offset="100%" stop-color="#3A181C"/>
    </linearGradient>

    <!-- Silver & Antique Gold Gradient -->
    <linearGradient id="silver-gold-v2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D1C097"/>
      <stop offset="70%" stop-color="#8C7A51"/>
      <stop offset="100%" stop-color="#E8DBBA"/>
    </linearGradient>

    <!-- Mourning Banner Ribbon -->
    <linearGradient id="mourning-ribbon-v2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A0305"/>
      <stop offset="50%" stop-color="#3D080D"/>
      <stop offset="100%" stop-color="#1A0305"/>
    </linearGradient>

    <linearGradient id="dark-green-ribbon-v2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071A12"/>
      <stop offset="50%" stop-color="#0F3827"/>
      <stop offset="100%" stop-color="#071A12"/>
    </linearGradient>

    <filter id="shadow-v2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="photo-clip-main-v2">
      <circle cx="600" cy="650" r="280"/>
    </clipPath>

    <clipPath id="photo-clip-2-v2">
      <circle cx="180" cy="1350" r="95"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="1600" fill="url(#bg-grad-v2)"/>
  <rect x="35" y="35" width="1130" height="1530" rx="8" fill="none" stroke="url(#silver-gold-v2)" stroke-width="3" opacity="0.8"/>
  <rect x="45" y="45" width="1110" height="1510" rx="6" fill="none" stroke="#D1C097" stroke-width="2" opacity="0.6"/>

  <!-- Black Ribbon Emblem (Top Left Corner) - Enhanced -->
  <g transform="translate(70, 70)">
    <path d="M 0 0 C 30 20 50 50 30 90 L 0 140 L 20 140 L 45 95 C 65 55 40 15 0 0 Z" fill="#111111" stroke="url(#silver-gold-v2)" stroke-width="2"/>
    <path d="M 30 90 C 10 110 -10 130 -30 140 L -10 140 C 10 130 25 110 45 95 Z" fill="#333333"/>
    <!-- Add a small cross/symbol -->
    <line x1="0" y1="60" x2="20" y2="80" stroke="url(#silver-gold-v2)" stroke-width="2"/>
    <line x1="20" y1="60" x2="0" y2="80" stroke="url(#silver-gold-v2)" stroke-width="2"/>
  </g>

  <!-- Top Label -->
  <text id="top-label" x="600" y="140" text-anchor="middle" fill="#D1C097" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" letter-spacing="4">
    বিনম্র শ্রদ্ধাঞ্জলি
  </text>

  <!-- Headline Banner -->
  <g filter="url(#shadow-v2)">
    <path d="M 100 215 L 1100 215 L 1135 275 L 1100 335 L 100 335 L 65 275 Z" fill="url(#mourning-ribbon-v2)" stroke="url(#silver-gold-v2)" stroke-width="3"/>
    <text id="headline-text" x="600" y="298" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="64" font-weight="800">
      শোক সভা ও দোয়া মাহফিল
    </text>
  </g>

  <!-- Candle Icons (Sides of Photo) - Enhanced -->
  <g transform="translate(180, 620)" opacity="1">
    <rect x="10" y="40" width="16" height="70" fill="#E8DBBA" rx="3" stroke="#D1C097" stroke-width="1"/>
    <ellipse cx="18" cy="30" rx="6" ry="12" fill="#FF9900"/>
    <ellipse cx="18" cy="32" rx="3" ry="7" fill="#FFFF00"/>
    <!-- Add flame glow -->
    <ellipse cx="18" cy="30" rx="8" ry="14" fill="#FF9900" opacity="0.3"/>
  </g>
  <g transform="translate(1000, 620)" opacity="1">
    <rect x="10" y="40" width="16" height="70" fill="#E8DBBA" rx="3" stroke="#D1C097" stroke-width="1"/>
    <ellipse cx="18" cy="30" rx="6" ry="12" fill="#FF9900"/>
    <ellipse cx="18" cy="32" rx="3" ry="7" fill="#FFFF00"/>
    <!-- Add flame glow -->
    <ellipse cx="18" cy="30" rx="8" ry="14" fill="#FF9900" opacity="0.3"/>
  </g>

  <!-- Main Photo Frame -->
  <circle cx="600" cy="650" r="300" fill="none" stroke="#222222" stroke-width="12"/>
  <circle cx="600" cy="650" r="290" fill="none" stroke="url(#silver-gold-v2)" stroke-width="6"/>

  <g clip-path="url(#photo-clip-main-v2)">
    <circle id="photo-slot-main" cx="600" cy="650" r="280" fill="#3A3A3A"/>
    <circle cx="600" cy="585" r="70" fill="#666666"/>
    <path d="M 440 820 C 450 700 510 660 600 660 C 690 660 750 700 760 820 Z" fill="#666666"/>
    <text id="photo-placeholder-label" x="600" y="890" text-anchor="middle" fill="#D1C097" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="24" font-weight="600">
      ছবি সংযুক্ত করুন
    </text>
  </g>

  <!-- Candidate Name Banner -->
  <g filter="url(#shadow-v2)">
    <path d="M 140 950 L 1060 950 L 1095 1005 L 1060 1060 L 140 1060 L 105 1005 Z" fill="url(#dark-green-ribbon-v2)" stroke="url(#silver-gold-v2)" stroke-width="3"/>
    <text id="name-text" x="600" y="1025" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="72" font-weight="800">
      নামের স্থান
    </text>
  </g>

  <!-- Designation -->
  <text id="designation-text" x="600" y="1115" text-anchor="middle" fill="#D1C097" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="38" font-weight="600">
    পদবী / সংগঠনের নাম
  </text>

  <path d="M 280 1155 H 520 M 680 1155 H 920" stroke="url(#silver-gold-v2)" stroke-width="2"/>
  <circle cx="600" cy="1155" r="6" fill="#D1C097"/>

  <!-- District Badge -->
  <rect id="district-party-bg" x="280" y="1185" width="640" height="80" rx="40" fill="#121714" stroke="url(#silver-gold-v2)" stroke-width="2"/>
  <text id="district-text" x="600" y="1238" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="34" font-weight="600">
    জেলা / এলাকার নাম
  </text>

  <!-- Secondary Photo Slot -->
  <circle cx="180" cy="1350" r="108" fill="#121714" stroke="url(#silver-gold-v2)" stroke-width="5"/>
  <g clip-path="url(#photo-clip-2-v2)">
    <circle id="photo-slot-2" cx="180" cy="1350" r="95" fill="#4A4A4A"/>
    <circle cx="180" cy="1325" r="25" fill="#777777"/>
    <path d="M 135 1410 C 138 1370 155 1355 180 1355 C 205 1355 222 1370 225 1410 Z" fill="#777777"/>
  </g>
  <text id="photo-2-label" x="180" y="1475" text-anchor="middle" fill="#D1C097" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="600">
    সহযোদ্ধা
  </text>

  <!-- Information Panel -->
  <rect x="340" y="1300" width="720" height="160" rx="18" fill="#121714" stroke="url(#silver-gold-v2)" stroke-width="2"/>
  <text id="information-heading" x="700" y="1348" text-anchor="middle" fill="#D1C097" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="26" font-weight="700">
    স্মরণে ও প্রার্থনায়
  </text>
  <text id="information-line-1" x="700" y="1392" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="500">
    সংক্ষিপ্ত পরিচিতি / বার্তা
  </text>
  <text id="information-line-2" x="700" y="1432" text-anchor="middle" fill="#A0A0A0" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22">
    যোগাযোগের তথ্য / অন্যান্য বিবরণ
  </text>

  <!-- Footer -->
  <path d="M 0 1520 C 300 1480 600 1550 1200 1490 L 1200 1600 L 0 1600 Z" fill="#0A0A0A"/>
  <path d="M 0 1520 C 300 1480 600 1550 1200 1490" fill="none" stroke="url(#silver-gold-v2)" stroke-width="3"/>
  <text id="footer-text" x="600" y="1565" text-anchor="middle" fill="#D1C097" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="24" font-weight="600">
    শোকাহতে: আপনার বার্তা এখানে
  </text>
</svg>