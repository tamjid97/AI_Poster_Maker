<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1600" viewBox="0 0 1200 1600" version="1.1">
  <defs>
    <!-- Deep Navy & Emerald Gradient -->
    <linearGradient id="bg-grad-v6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#006466"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad-v6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="50%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#FAEDCD"/>
    </linearGradient>

    <!-- Cyan Glow Ribbon -->
    <linearGradient id="cyan-ribbon-v6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A3641"/>
      <stop offset="50%" stop-color="#136F63"/>
      <stop offset="100%" stop-color="#0A3641"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow-v6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="photo-clip-top-left-1"><circle cx="120" cy="120" r="42"/></clipPath>
    <clipPath id="photo-clip-top-left-2"><circle cx="225" cy="120" r="42"/></clipPath>
    <clipPath id="photo-clip-top-right-1"><circle cx="975" cy="120" r="42"/></clipPath>
    <clipPath id="photo-clip-top-right-2"><circle cx="1080" cy="120" r="42"/></clipPath>
    <clipPath id="photo-clip-main-v6"><circle cx="600" cy="700" r="275"/></clipPath>
  </defs>

  <!-- Background Layer -->
  <rect x="0" y="0" width="1200" height="1600" fill="url(#bg-grad-v6)"/>
  <rect x="30" y="30" width="1140" height="1540" rx="12" fill="none" stroke="url(#gold-grad-v6)" stroke-width="2.5" opacity="0.6"/>

  <!-- Top Leaders Header Row -->
  <g id="top-leaders-bar">
    <!-- Leader 1 -->
    <circle cx="120" cy="120" r="46" fill="url(#gold-grad-v6)"/>
    <g clip-path="url(#photo-clip-top-left-1)">
      <circle id="photo-slot-top-1" cx="120" cy="120" r="42" fill="#D1D5DB"/>
      <circle cx="120" cy="108" r="13" fill="#6B7280"/>
      <path d="M 98 148 C 100 130 108 122 120 122 C 132 122 140 130 142 148 Z" fill="#6B7280"/>
    </g>

    <!-- Leader 2 -->
    <circle cx="225" cy="120" r="46" fill="url(#gold-grad-v6)"/>
    <g clip-path="url(#photo-clip-top-left-2)">
      <circle id="photo-slot-top-2" cx="225" cy="120" r="42" fill="#D1D5DB"/>
      <circle cx="225" cy="108" r="13" fill="#6B7280"/>
      <path d="M 203 148 C 205 130 213 122 225 122 C 237 122 245 130 247 148 Z" fill="#6B7280"/>
    </g>

    <!-- Center Emblem -->
    <g transform="translate(600, 115)">
      <circle cx="0" cy="0" r="58" fill="#051923" stroke="url(#gold-grad-v6)" stroke-width="3"/>
      <polygon points="0,-35 25,25 -25,25" fill="#E76F51"/>
      <text id="emblem-text" x="0" y="10" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="18" font-weight="700">ঐক্য</text>
    </g>

    <!-- Leader 3 -->
    <circle cx="975" cy="120" r="46" fill="url(#gold-grad-v6)"/>
    <g clip-path="url(#photo-clip-top-right-1)">
      <circle id="photo-slot-top-3" cx="975" cy="120" r="42" fill="#D1D5DB"/>
      <circle cx="975" cy="108" r="13" fill="#6B7280"/>
      <path d="M 953 148 C 955 130 963 122 975 122 C 987 122 995 130 997 148 Z" fill="#6B7280"/>
    </g>

    <!-- Leader 4 -->
    <circle cx="1080" cy="120" r="46" fill="url(#gold-grad-v6)"/>
    <g clip-path="url(#photo-clip-top-right-2)">
      <circle id="photo-slot-top-4" cx="1080" cy="120" r="42" fill="#D1D5DB"/>
      <circle cx="1080" cy="108" r="13" fill="#6B7280"/>
      <path d="M 1058 148 C 1060 130 1068 122 1080 122 C 1092 122 1100 130 1102 148 Z" fill="#6B7280"/>
    </g>
  </g>

  <!-- Top Title -->
  <text id="top-label" x="600" y="215" text-anchor="middle" fill="#E76F51" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="30" font-weight="800" letter-spacing="3">
    তরুণ ও যুব সমাবেশ
  </text>

  <!-- Headline Text -->
  <g filter="url(#shadow-v6)">
    <path d="M 110 245 L 1090 245 L 1125 310 L 1090 375 L 110 375 L 75 310 Z" fill="url(#cyan-ribbon-v6)" stroke="url(#gold-grad-v6)" stroke-width="3"/>
    <text id="headline-text" x="600" y="330" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="66" font-weight="800">
      বিভাগীয় যুব মহাসমাবেশ
    </text>
  </g>

  <text id="sub-headline-text" x="600" y="420" text-anchor="middle" fill="#E9C46A" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="30" font-weight="600">
    প্রধান অতিথি ও কেন্দ্রীয় নেতৃবৃন্দের আগমন
  </text>

  <!-- Event Info Pill Grid -->
  <g id="event-info-box" transform="translate(180, 450)">
    <rect x="0" y="0" width="840" height="60" rx="30" fill="#051923" stroke="url(#gold-grad-v6)" stroke-width="2"/>
    <text id="event-date" x="160" y="38" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="700">📅 ২৫শে আগস্ট ২০২৬</text>
    <line x1="320" y1="10" x2="320" y2="50" stroke="#136F63" stroke-width="2"/>
    <text id="event-venue" x="520" y="38" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="700">📍 জেলা স্টেডিয়াম মাঠ</text>
    <line x1="700" y1="10" x2="700" y2="50" stroke="#136F63" stroke-width="2"/>
    <text id="event-time" x="770" y="38" text-anchor="middle" fill="#E9C46A" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="22" font-weight="700">⏰ বিকাল ৩ টা</text>
  </g>

  <!-- Main Candidate Photo Slot -->
  <circle cx="600" cy="700" r="288" fill="none" stroke="url(#gold-grad-v6)" stroke-width="8"/>
  <g clip-path="url(#photo-clip-main-v6)">
    <circle id="photo-slot-main" cx="600" cy="700" r="275" fill="#E5E7EB"/>
    <circle cx="600" cy="630" r="70" fill="#9CA3AF"/>
    <path d="M 440 870 C 450 740 510 700 600 700 C 690 700 750 740 760 870 Z" fill="#9CA3AF"/>
    <text id="photo-placeholder-label" x="600" y="930" text-anchor="middle" fill="#4B5563" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="24" font-weight="600">
      প্রধান প্রার্থীর ছবি
    </text>
  </g>

  <!-- Candidate Name Banner -->
  <g filter="url(#shadow-v6)">
    <path d="M 120 1010 L 1080 1010 L 1115 1070 L 1080 1130 L 120 1130 L 85 1070 Z" fill="#E76F51" stroke="url(#gold-grad-v6)" stroke-width="3"/>
    <text id="name-text" x="600" y="1090" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="68" font-weight="800">
      আপনার প্রার্থীর নাম
    </text>
  </g>

  <!-- Designation -->
  <text id="designation-text" x="600" y="1180" text-anchor="middle" fill="#E9C46A" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="36" font-weight="700">
    সদস্য সচিব / আহ্বায়ক
  </text>

  <!-- Organization Badge -->
  <rect id="district-party-bg" x="250" y="1220" width="700" height="90" rx="20" fill="#051923" stroke="url(#gold-grad-v6)" stroke-width="2.5"/>
  <text id="district-text" x="600" y="1275" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="34" font-weight="800">
    জাতীয় নাগরিক পার্টি - জেলা শাখা
  </text>

  <!-- Footer Footer -->
  <path d="M 0 1480 Q 600 1420 1200 1480 L 1200 1600 L 0 1600 Z" fill="#020C12"/>
  <path d="M 0 1480 Q 600 1420 1200 1480" fill="none" stroke="url(#gold-grad-v6)" stroke-width="3"/>
  <text id="footer-text" x="600" y="1550" text-anchor="middle" fill="#E9C46A" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="26" font-weight="600">
    প্রচারে: সর্বস্তরের ছাত্র ও যুবজনতা
  </text>
</svg>