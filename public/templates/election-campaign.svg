<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="1600"
  viewBox="0 0 1200 1600"
  version="1.1">

  <defs>

    <!-- =========================================================
         BACKGROUND GRADIENT
         ========================================================= -->
    <linearGradient id="background-gradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071F18"/>
      <stop offset="48%" stop-color="#0B3024"/>
      <stop offset="100%" stop-color="#260F16"/>
    </linearGradient>

    <radialGradient id="background-glow"
                    cx="50%" cy="35%"
                    r="70%">
      <stop offset="0%" stop-color="#1A5942" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#0B3024" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050D0A" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold gradient -->
    <linearGradient id="gold-gradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1A8"/>
      <stop offset="35%" stop-color="#DDB84A"/>
      <stop offset="70%" stop-color="#B88920"/>
      <stop offset="100%" stop-color="#F5D878"/>
    </linearGradient>

    <!-- Headline ribbon gradient -->
    <linearGradient id="headline-gradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F1828"/>
      <stop offset="50%" stop-color="#B82035"/>
      <stop offset="100%" stop-color="#741321"/>
    </linearGradient>

    <!-- Bottom name ribbon -->
    <linearGradient id="name-gradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#063B2A"/>
      <stop offset="50%" stop-color="#0B5A3E"/>
      <stop offset="100%" stop-color="#063B2A"/>
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="soft-shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feGaussianBlur in="SourceAlpha"
                      stdDeviation="12"/>
      <feOffset dx="0"
                 dy="10"
                 result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear"
                 slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Main photo clip -->
    <clipPath id="photo-clip-main">
      <circle
        id="photo-clip-circle-main"
        cx="600"
        cy="650"
        r="285"/>
    </clipPath>

    <!-- Secondary photo clip -->
    <clipPath id="photo-clip-2">
      <circle
        id="photo-clip-circle-2"
        cx="175"
        cy="1275"
        r="105"/>
    </clipPath>

    <!-- Decorative geometric pattern -->
    <pattern id="geometric-pattern"
             width="100"
             height="100"
             patternUnits="userSpaceOnUse">
      <path
        id="pattern-path-1"
        d="M50 5 L95 50 L50 95 L5 50 Z"
        fill="none"
        stroke="#DDB84A"
        stroke-width="1.5"
        opacity="0.14"/>

      <circle
        id="pattern-circle-1"
        cx="50"
        cy="50"
        r="18"
        fill="none"
        stroke="#DDB84A"
        stroke-width="1"
        opacity="0.12"/>
    </pattern>

  </defs>


  <!-- =========================================================
       1. BACKGROUND
       ========================================================= -->

  <rect
    id="background"
    x="0"
    y="0"
    width="1200"
    height="1600"
    fill="url(#background-gradient)"/>

  <rect
    id="background-glow"
    x="0"
    y="0"
    width="1200"
    height="1600"
    fill="url(#background-glow)"/>


  <!-- =========================================================
       DECORATIVE GEOMETRIC BACKGROUND
       ========================================================= -->

  <rect
    id="decoration-pattern"
    x="0"
    y="0"
    width="1200"
    height="1600"
    fill="url(#geometric-pattern)"/>


  <!-- =========================================================
       9. DECORATION
       ========================================================= -->

  <!-- Top gold line -->
  <path
    id="decoration-top-line"
    d="M70 72 H1130"
    fill="none"
    stroke="url(#gold-gradient)"
    stroke-width="5"/>

  <path
    id="decoration-top-line-thin"
    d="M150 88 H1050"
    fill="none"
    stroke="#DDB84A"
    stroke-width="1"
    opacity="0.65"/>

  <!-- Decorative corner -->
  <path
    id="decoration-top-left"
    d="M70 72
       L70 180
       M70 115
       L115 72
       M70 150
       L150 72"
    fill="none"
    stroke="#DDB84A"
    stroke-width="3"
    opacity="0.85"/>

  <path
    id="decoration-top-right"
    d="M1130 72
       L1130 180
       M1130 115
       L1085 72
       M1130 150
       L1050 72"
    fill="none"
    stroke="#DDB84A"
    stroke-width="3"
    opacity="0.85"/>


  <!-- =========================================================
       8. BANGLADESH FLAG MOTIF
       ========================================================= -->

  <g id="flag-motif"
     transform="translate(970 110)">

    <!-- Flag -->
    <rect
      id="flag-green"
      x="0"
      y="0"
      width="145"
      height="90"
      rx="4"
      fill="#006A4E"/>

    <circle
      id="flag-red"
      cx="72"
      cy="45"
      r="28"
      fill="#F42A41"/>

    <!-- Flag pole -->
    <rect
      id="flag-pole"
      x="-10"
      y="-8"
      width="6"
      height="112"
      rx="3"
      fill="url(#gold-gradient)"/>

    <!-- Flag base -->
    <rect
      id="flag-base"
      x="-25"
      y="102"
      width="40"
      height="7"
      rx="3"
      fill="url(#gold-gradient)"/>
  </g>


  <!-- =========================================================
       SMALL TOP LABEL
       ========================================================= -->

  <text
    id="top-label"
    x="600"
    y="145"
    text-anchor="middle"
    fill="#F5D878"
    font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
    font-size="26"
    font-weight="600"
    letter-spacing="3">
    বাংলাদেশ
  </text>


  <!-- =========================================================
       4. HEADLINE RIBBON
       ========================================================= -->

  <g id="headline-banner"
     filter="url(#soft-shadow)">

    <!-- Left tail -->
    <path
      id="headline-ribbon-left"
      d="M90 220
         L155 220
         L190 275
         L155 330
         L90 330
         L125 275 Z"
      fill="#711522"/>

    <!-- Main ribbon -->
    <path
      id="headline-ribbon"
      d="M140 215
         H1060
         L1095 275
         L1060 335
         H140
         L105 275 Z"
      fill="url(#headline-gradient)"
      stroke="url(#gold-gradient)"
      stroke-width="4"/>

    <!-- Right tail -->
    <path
      id="headline-ribbon-right"
      d="M1110 220
         L1045 220
         L1010 275
         L1045 330
         L1110 330
         L1075 275 Z"
      fill="#711522"/>

    <!-- Headline -->
    <text
      id="headline-text"
      x="600"
      y="298"
      text-anchor="middle"
      fill="#FFF4B5"
      font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
      font-size="72"
      font-weight="800">
      জনগণের পাশে
    </text>

  </g>


  <!-- =========================================================
       MAIN PHOTO OUTER SHADOW
       ========================================================= -->

  <circle
    id="photo-shadow-main"
    cx="600"
    cy="650"
    r="315"
    fill="#000000"
    opacity="0.35"/>


  <!-- =========================================================
       2. MAIN PHOTO FRAME
       ========================================================= -->

  <!-- Outer gold ring -->
  <circle
    id="photo-frame-main-outer"
    cx="600"
    cy="650"
    r="315"
    fill="none"
    stroke="#5D4314"
    stroke-width="16"/>

  <!-- Gold highlight -->
  <circle
    id="photo-frame-main"
    cx="600"
    cy="650"
    r="305"
    fill="none"
    stroke="url(#gold-gradient)"
    stroke-width="10"/>

  <!-- Inner dark ring -->
  <circle
    id="photo-frame-main-inner"
    cx="600"
    cy="650"
    r="290"
    fill="#101814"
    stroke="#E4C65E"
    stroke-width="3"/>


  <!-- =========================================================
       MAIN PHOTO PLACEHOLDER
       This circle is the target area for an <image>
       using clip-path="url(#photo-clip-main)"
       ========================================================= -->

  <circle
    id="photo-slot-main"
    cx="600"
    cy="650"
    r="285"
    fill="#D7D7D7"/>

  <!-- Placeholder inner circle -->
  <circle
    id="photo-placeholder-overlay"
    cx="600"
    cy="650"
    r="270"
    fill="#C7C7C7"
    opacity="0.45"/>

  <!-- Placeholder person silhouette -->
  <circle
    id="photo-placeholder-head"
    cx="600"
    cy="585"
    r="72"
    fill="#A5A5A5"/>

  <path
    id="photo-placeholder-body"
    d="M445 820
       C455 700 510 665 600 665
       C690 665 745 700 755 820
       Z"
    fill="#A5A5A5"/>

  <!-- Photo placeholder label -->
  <text
    id="photo-placeholder-label"
    x="600"
    y="900"
    text-anchor="middle"
    fill="#555555"
    font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
    font-size="25"
    font-weight="600"
    opacity="0.8">
    ছবি সংযুক্ত করুন
  </text>


  <!-- =========================================================
       PHOTO DECORATIVE RINGS
       ========================================================= -->

  <circle
    id="photo-ring-dash"
    cx="600"
    cy="650"
    r="330"
    fill="none"
    stroke="#E8CD68"
    stroke-width="2"
    stroke-dasharray="4 18"
    opacity="0.75"/>


  <!-- =========================================================
       PHOTO SIDE ORNAMENTS
       ========================================================= -->

  <circle
    id="decoration-photo-left"
    cx="255"
    cy="650"
    r="7"
    fill="#DDB84A"/>

  <circle
    id="decoration-photo-right"
    cx="945"
    cy="650"
    r="7"
    fill="#DDB84A"/>

  <path
    id="decoration-photo-left-line"
    d="M175 650 H245"
    stroke="#DDB84A"
    stroke-width="2"
    opacity="0.7"/>

  <path
    id="decoration-photo-right-line"
    d="M955 650 H1025"
    stroke="#DDB84A"
    stroke-width="2"
    opacity="0.7"/>


  <!-- =========================================================
       NAME RIBBON
       ========================================================= -->

  <g id="name-banner"
     filter="url(#soft-shadow)">

    <!-- Ribbon -->
    <path
      id="name-ribbon-shape"
      d="M145 945
         H1055
         L1090 1000
         L1055 1055
         H145
         L110 1000
         Z"
      fill="url(#name-gradient)"
      stroke="url(#gold-gradient)"
      stroke-width="4"/>

    <!-- Left gold accent -->
    <path
      id="name-ribbon-accent-left"
      d="M110 1000 L145 945 L145 1055 Z"
      fill="#DDB84A"/>

    <!-- Right gold accent -->
    <path
      id="name-ribbon-accent-right"
      d="M1090 1000 L1055 945 L1055 1055 Z"
      fill="#DDB84A"/>

    <!-- 5. NAME -->
    <text
      id="name-text"
      x="600"
      y="1018"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
      font-size="76"
      font-weight="800">
      নামের স্থান
    </text>

  </g>


  <!-- =========================================================
       6. DESIGNATION
       ========================================================= -->

  <text
    id="designation-text"
    x="600"
    y="1115"
    text-anchor="middle"
    fill="#F5D878"
    font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
    font-size="40"
    font-weight="600">
    পদবী / সংগঠনের নাম
  </text>


  <!-- Decorative divider -->
  <g id="decoration-divider">

    <path
      id="divider-left"
      d="M250 1160 H500"
      fill="none"
      stroke="#DDB84A"
      stroke-width="3"/>

    <circle
      id="divider-center"
      cx="600"
      cy="1160"
      r="8"
      fill="#DDB84A"/>

    <path
      id="divider-right"
      d="M700 1160 H950"
      fill="none"
      stroke="#DDB84A"
      stroke-width="3"/>

  </g>


  <!-- =========================================================
       7. DISTRICT / PARTY TEXT AREA
       ========================================================= -->

  <g id="district-party-panel">

    <rect
      id="district-party-bg"
      x="275"
      y="1190"
      width="650"
      height="90"
      rx="45"
      fill="#071F18"
      stroke="#B88920"
      stroke-width="2"/>

    <text
      id="district-text"
      x="600"
      y="1248"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
      font-size="36"
      font-weight="600">
      জেলা / এলাকার নাম
    </text>

  </g>


  <!-- =========================================================
       3. SECONDARY PHOTO SLOT
       ========================================================= -->

  <circle
    id="photo-frame-2"
    cx="175"
    cy="1275"
    r="120"
    fill="#071F18"
    stroke="url(#gold-gradient)"
    stroke-width="8"/>

  <circle
    id="photo-slot-2"
    cx="175"
    cy="1275"
    r="105"
    fill="#D7D7D7"/>


  <!-- Secondary placeholder silhouette -->
  <circle
    id="photo-placeholder-head-2"
    cx="175"
    cy="1245"
    r="28"
    fill="#A5A5A5"/>

  <path
    id="photo-placeholder-body-2"
    d="M125 1350
       C128 1300 148 1280 175 1280
       C202 1280 222 1300 225 1350
       Z"
    fill="#A5A5A5"/>


  <!-- =========================================================
       SECONDARY PHOTO LABEL
       ========================================================= -->

  <text
    id="photo-2-label"
    x="175"
    y="1415"
    text-anchor="middle"
    fill="#DDB84A"
    font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
    font-size="24"
    font-weight="600">
    সহযোদ্ধা
  </text>


  <!-- =========================================================
       RIGHT INFORMATION PANEL
       ========================================================= -->

  <g id="information-panel">

    <rect
      id="information-panel-bg"
      x="350"
      y="1320"
      width="700"
      height="180"
      rx="20"
      fill="#061812"
      stroke="#B88920"
      stroke-width="2"/>

    <!-- Small heading -->
    <text
      id="information-heading"
      x="700"
      y="1370"
      text-anchor="middle"
      fill="#DDB84A"
      font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
      font-size="27"
      font-weight="700">
      পরিচিতি
    </text>

    <!-- Information line 1 -->
    <text
      id="information-line-1"
      x="700"
      y="1415"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
      font-size="29"
      font-weight="500">
      সংক্ষিপ্ত পরিচিতি / বার্তা
    </text>

    <!-- Information line 2 -->
    <text
      id="information-line-2"
      x="700"
      y="1460"
      text-anchor="middle"
      fill="#C9D7D1"
      font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
      font-size="24">
      যোগাযোগের তথ্য / অন্যান্য বিবরণ
    </text>

  </g>


  <!-- =========================================================
       BOTTOM DECORATIVE SWOOSH
       ========================================================= -->

  <path
    id="decoration-bottom-swoosh"
    d="M0 1530
       C220 1450 430 1575 620 1510
       C810 1445 1010 1510 1200 1450
       L1200 1600
       L0 1600 Z"
    fill="#061812"
    opacity="0.95"/>

  <path
    id="decoration-bottom-gold"
    d="M0 1530
       C220 1450 430 1575 620 1510
       C810 1445 1010 1510 1200 1450"
    fill="none"
    stroke="url(#gold-gradient)"
    stroke-width="5"/>


  <!-- =========================================================
       BOTTOM FLAG MOTIF
       ========================================================= -->

  <g
    id="bottom-flag-motif"
    transform="translate(1020 1510)">

    <rect
      id="bottom-flag-green"
      x="0"
      y="0"
      width="115"
      height="65"
      rx="3"
      fill="#006A4E"/>

    <circle
      id="bottom-flag-red"
      cx="57"
      cy="32"
      r="20"
      fill="#F42A41"/>

  </g>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <text
    id="footer-text"
    x="600"
    y="1550"
    text-anchor="middle"
    fill="#DDB84A"
    font-family="Hind Siliguri, Noto Sans Bengali, sans-serif"
    font-size="22"
    font-weight="500"
    letter-spacing="1">
    আপনার বার্তা এখানে
  </text>


  <!-- =========================================================
       PRINT-SAFE BORDER
       ========================================================= -->

  <rect
    id="print-safe-border"
    x="35"
    y="35"
    width="1130"
    height="1530"
    rx="8"
    fill="none"
    stroke="#DDB84A"
    stroke-width="2"
    opacity="0.7"/>


</svg>