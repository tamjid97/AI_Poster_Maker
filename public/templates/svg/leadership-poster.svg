<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1600" viewBox="0 0 1200 1600" version="1.1">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dff8ff"/>
    </linearGradient>

    <!-- Headline Gradient -->
    <linearGradient id="headline-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1b1b"/>
      <stop offset="50%" stop-color="#ed1515"/>
      <stop offset="100%" stop-color="#ff1b1b"/>
    </linearGradient>

    <!-- Photo Clip Path -->
    <clipPath id="photo-clip-leader">
      <path d="M50 486 Q50 778 200 778 L600 778 L600 160 L200 160 Q50 160 50 486 Z"/>
    </clipPath>

    <clipPath id="photo-clip-small">
      <circle cx="175" cy="115" r="72"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bg-grad)"/>

  <!-- Decorative Elements -->
  <circle cx="175" cy="115" r="85" fill="#e8f4fd" opacity="0.5"/>
  <circle cx="175" cy="115" r="60" fill="#d1e9fc" opacity="0.6"/>

  <!-- Leader Photo Section -->
  <g id="leader-photo-section">
    <!-- Silhouette placeholder -->
    <path id="leader-silhouette" d="M50 486 Q50 778 200 778 L600 778 L600 160 L200 160 Q50 160 50 486 Z" fill="#d1e9fc" opacity="0.4"/>
  </g>

  <!-- Small Photo Slot -->
  <g id="small-photo-section">
    <circle id="small-photo-circle" cx="175" cy="115" r="72" fill="#d1e9fc" opacity="0.4"/>
  </g>

  <!-- Blue Dots Decoration -->
  <g id="blue-dots">
    <circle cx="700" cy="100" r="15" fill="#079c45" opacity="0.3"/>
    <circle cx="750" cy="150" r="10" fill="#079c45" opacity="0.4"/>
    <circle cx="800" cy="200" r="12" fill="#079c45" opacity="0.3"/>
    <circle cx="850" cy="250" r="8" fill="#079c45" opacity="0.5"/>
    <circle cx="900" cy="300" r="14" fill="#079c45" opacity="0.3"/>
    <circle cx="950" cy="350" r="10" fill="#079c45" opacity="0.4"/>
    <circle cx="1000" cy="400" r="12" fill="#079c45" opacity="0.3"/>
    <circle cx="1050" cy="450" r="8" fill="#079c45" opacity="0.5"/>
  </g>

  <!-- Headline Section -->
  <g id="headline-section">
    <text id="headline-text" x="930" y="995" text-anchor="middle" fill="url(#headline-gradient)" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="108" font-weight="900">নতুন নেতৃত্ব</text>
  </g>

  <!-- Name Section -->
  <g id="name-section">
    <text id="name-text" x="700" y="1395" text-anchor="middle" fill="#ffffff" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="47" font-weight="800">নাম এখানে</text>
  </g>

  <!-- Designation Section -->
  <g id="designation-section">
    <text id="designation-text" x="700" y="1445" text-anchor="middle" fill="#ffe86b" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="27" font-weight="500">পদবী এখানে</text>
  </g>

  <!-- Bottom Banner -->
  <g id="bottom-banner">
    <rect x="550" y="1500" width="650" height="100" fill="#ed1515"/>
    <text x="875" y="1560" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="42" font-weight="700">নতুন নেতৃত্ব</text>
  </g>

  <!-- Emblem -->
  <g id="emblem">
    <circle cx="1100" cy="100" r="50" fill="#079c45" opacity="0.2"/>
    <circle cx="1100" cy="100" r="35" fill="#079c45" opacity="0.4"/>
    <circle cx="1100" cy="100" r="20" fill="#079c45" opacity="0.6"/>
  </g>

  <!-- Dove Symbol -->
  <g id="dove">
    <path d="M1050 700 Q1070 680 1090 700 Q1110 720 1130 700 Q1150 680 1170 700" stroke="#079c45" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M1050 720 Q1070 700 1090 720 Q1110 740 1130 720 Q1150 700 1170 720" stroke="#079c45" stroke-width="3" fill="none" opacity="0.5"/>
  </g>
</svg>