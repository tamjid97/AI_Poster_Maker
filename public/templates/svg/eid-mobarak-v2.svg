<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1600" viewBox="0 0 1200 1600" version="1.1">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="50%" stop-color="#fff5df"/>
      <stop offset="100%" stop-color="#f9e8c5"/>
    </linearGradient>

    <!-- Headline Gradient -->
    <linearGradient id="headline-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e88919"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e88919"/>
    </linearGradient>

    <!-- Photo Clip Paths -->
    <clipPath id="photo-clip-main">
      <ellipse cx="600" cy="1117" rx="165" ry="142"/>
    </clipPath>

    <clipPath id="photo-clip-1">
      <circle cx="215" cy="285" r="112"/>
    </clipPath>

    <clipPath id="photo-clip-2">
      <circle cx="130" cy="405" r="72"/>
    </clipPath>

    <clipPath id="photo-clip-3">
      <circle cx="292" cy="405" r="72"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bg-grad)"/>

  <!-- Decorative Elements -->
  <circle cx="600" cy="200" r="80" fill="#f5a623" opacity="0.2"/>
  <circle cx="600" cy="200" r="60" fill="#e88919" opacity="0.3"/>
  <circle cx="600" cy="200" r="40" fill="#f5a623" opacity="0.4"/>

  <!-- Top Photo Slots -->
  <g id="leader-photos">
    <!-- Photo Slot 1 - Top -->
    <g id="photo-slot-1">
      <circle id="photo-slot-1-head" cx="215" cy="285" r="112" fill="#d4a373" opacity="0.3"/>
      <path id="photo-slot-1-body" d="M215 285 L215 397 Q215 450 170 450 L260 450 Q215 450 215 397 Z" fill="#d4a373" opacity="0.3"/>
    </g>

    <!-- Photo Slot 2 - Bottom Left -->
    <g id="photo-slot-2">
      <circle id="photo-slot-2-head" cx="130" cy="405" r="72" fill="#d4a373" opacity="0.3"/>
      <path id="photo-slot-2-body" d="M130 405 L130 477 Q130 510 100 510 L160 510 Q130 510 130 477 Z" fill="#d4a373" opacity="0.3"/>
    </g>

    <!-- Photo Slot 3 - Bottom Right -->
    <g id="photo-slot-3">
      <circle id="photo-slot-3-head" cx="292" cy="405" r="72" fill="#d4a373" opacity="0.3"/>
      <path id="photo-slot-3-body" d="M292 405 L292 477 Q292 510 262 510 L322 510 Q292 510 292 477 Z" fill="#d4a373" opacity="0.3"/>
    </g>
  </g>

  <!-- Main Person Photo Section -->
  <g id="main-person-section">
    <!-- Silhouette placeholder -->
    <ellipse id="main-silhouette-head" cx="600" cy="1117" rx="165" ry="142" fill="#d4a373" opacity="0.3"/>
    <path id="main-silhouette-shoulders" d="M435 1259 Q435 1400 600 1400 Q765 1400 765 1259 Z" fill="#d4a373" opacity="0.3"/>
  </g>

  <!-- EDITABLE PHOTO INSERTION GUIDE -->
  <!-- Replace the silhouette with actual photo using image element with clip-path="url(#photo-clip-main)" -->

  <!-- Headline Section -->
  <g id="headline-section">
    <text id="headline-text" x="600" y="745" text-anchor="middle" fill="url(#headline-gradient)" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="122" font-weight="900" letter-spacing="1">ঈদ মোবারক</text>
  </g>

  <!-- Message Section -->
  <g id="message-section">
    <text x="600" y="850" text-anchor="middle" fill="#07583F" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="32" font-weight="600">
      <tspan id="message-line-1" x="600" dy="0">ঈদ মোবারক! দেশ ও বিদেশের সকল ধর্মপ্রাণ</tspan>
      <tspan id="message-line-2" x="600" dy="43">মুসলিম ভাই ও বোনদের জানাই ঈদের শুভেচ্ছা।</tspan>
    </text>
  </g>

  <!-- Name Section -->
  <g id="name-section">
    <text id="name-text" x="600" y="1430" text-anchor="middle" fill="#ffffff" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="58" font-weight="800">নাম এখানে</text>
  </g>

  <!-- Designation Section -->
  <g id="designation-section">
    <text id="designation-text" x="600" y="1490" text-anchor="middle" fill="#e9e6d8" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="500">পদবী, দলের নাম</text>
  </g>

  <!-- Bottom Banner -->
  <g id="bottom-banner">
    <rect x="0" y="1520" width="1200" height="80" fill="#07563E"/>
    <text x="600" y="1570" text-anchor="middle" fill="#FFFFFF" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="36" font-weight="700">ঈদ মোবারক</text>
  </g>
</svg>